<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>이동 중…</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 20px; line-height: 1.6; }
      a { font-size: 1.1rem; }
      .sub { font-size: .85rem; opacity: .6; margin-top: 12px; }
    </style>
  </head>
  <body>
    <p id="msg">이동 중…</p>
    <p id="manual"></p>
    <p class="sub" id="diag"></p>

    <script>
      /*
       * 증권사 앱 스토어로 보내는 전용 페이지.
       *
       * Mini App(t.me/<봇>/<앱>)을 경유하지 않는다. 텔레그램이 Mini App 페이지를
       * 오래 캐시해서 코드를 고쳐도 반영이 안 되는 문제를 겪었고, 애초에
       * WebApp.platform 없이 userAgent 만으로도 OS 판별이 충분하다.
       *
       *   버튼 → go.html?b=<slug> → userAgent 판별 → Play / App Store
       */
      (function () {
        var q = new URLSearchParams(location.search);
        var slug = q.get('b') || '';
        var ua = navigator.userAgent;
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);

        document.getElementById('diag').textContent =
          (isAndroid ? 'Android' : isIOS ? 'iOS' : '기타') + ' · ' + slug;

        function fail(text) {
          document.getElementById('msg').textContent = text;
          document.getElementById('manual').innerHTML =
            '<a href="./">공모주 일정 전체 보기</a>';
        }

        if (!slug) return fail('잘못된 주소입니다.');

        fetch('state/brokers.json', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (map) {
            var name = Object.keys(map).find(function (k) { return map[k].slug === slug; });
            if (!name) return fail('알 수 없는 증권사입니다: ' + slug);

            var links = map[name];
            var url = isAndroid ? links.android : isIOS ? links.ios : links.landing;

            document.getElementById('msg').textContent = name + ' 앱으로 이동 중…';
            // 자동 이동이 막혀도 누를 수 있게 수동 링크를 먼저 그린다.
            document.getElementById('manual').innerHTML =
              '<a href="' + url + '">열리지 않으면 여기를 누르세요</a>';
            // location.replace 는 팝업 차단 대상이 아니고, 뒤로가기 이력도 안 남긴다.
            location.replace(url);
          })
          .catch(function (e) { fail('불러오지 못했습니다: ' + e.message); });
      })();
    </script>
  </body>
</html>
