<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>공모주 일정</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* 디자인은 생략. 읽을 수 있는 최소한만. */
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; line-height: 1.5; }
      h1 { font-size: 1.1rem; margin: 0 0 4px; }
      .meta { font-size: .8rem; opacity: .6; margin-bottom: 16px; }
      article { border-top: 1px solid rgba(128,128,128,.3); padding: 12px 0; }
      .name { font-weight: 600; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0; font-size: .9rem; }
      dt { opacity: .6; }
      dd { margin: 0; }
      .brokers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      button { font: inherit; padding: 6px 12px; cursor: pointer; }
      button[disabled] { opacity: .5; cursor: default; }
      #error { color: #c00; }
    </style>
  </head>
  <body>
    <h1>공모주 일정</h1>
    <div class="meta" id="meta">불러오는 중…</div>
    <div id="list"></div>
    <p id="error" hidden></p>

    <script type="module">
      const tg = window.Telegram?.WebApp;
      tg?.ready();
      tg?.expand();

      /**
       * 어느 스토어로 보낼지 고른다.
       *
       * Mini App 안에서는 WebApp.platform 이 정확하다. 일반 브라우저로 열렸을
       * 때를 대비해 userAgent 로 보조 판정한다. 둘 다 판별 못 하면 landing 으로
       * 보낸다 — 최소한 깨지지는 않는다.
       */
      function pickUrl(links) {
        const p = tg?.platform ?? '';
        const ua = navigator.userAgent;
        if (p === 'android' || /Android/i.test(ua)) return links.android;
        if (p === 'ios' || /iPhone|iPad|iPod/i.test(ua)) return links.ios;
        return links.landing;
      }

      function openUrl(url) {
        // 텔레그램 웹뷰 안에서는 openLink 로 외부 브라우저/스토어에 넘겨야 한다.
        if (tg?.openLink) tg.openLink(url);
        else window.open(url, '_blank', 'noopener');
      }

      function todayKst() {
        return new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
        }).format(new Date());
      }

      const el = (tag, props = {}, ...kids) => {
        const n = Object.assign(document.createElement(tag), props);
        for (const k of kids) n.append(k);
        return n;
      };

      function renderRow(row, brokers) {
        const art = el('article');
        art.append(el('div', { className: 'name', textContent: row.name }));

        const dl = el('dl');
        const fields = [
          ['일정', `${row.subStart} ~ ${row.subEnd}`],
          ['상장일', row.listingDate ?? '-'],
          ['확정가', row.finalPrice ?? '-'],
          ['희망가', row.hopePrice ?? '-'],
          ['경쟁률', row.ratio ?? '-'],
        ];
        for (const [k, v] of fields) {
          dl.append(el('dt', { textContent: k }), el('dd', { textContent: v }));
        }
        art.append(dl);

        const box = el('div', { className: 'brokers' });
        const names = (row.underwriter ?? '').split(',').map((s) => s.trim()).filter(Boolean);
        if (names.length === 0) box.append(el('span', { textContent: '주간사 정보 없음' }));
        for (const name of names) {
          const links = brokers[name];
          if (!links) {
            // 매핑에 없는 증권사. 눌리지 않는 버튼이 깨진 링크보다 낫다.
            box.append(el('button', { textContent: name, disabled: true }));
            continue;
          }
          const btn = el('button', { textContent: `${name} 앱 열기` });
          btn.addEventListener('click', () => openUrl(pickUrl(links)));
          box.append(btn);
        }
        art.append(box);
        return art;
      }

      /**
       * 버튼이 넘겨준 증권사 slug. 텔레그램은 startapp 값을 두 경로로 준다:
       * Mini App 으로 열리면 initDataUnsafe.start_param, 일반 브라우저로
       * 열리면 쿼리스트링(tgWebAppStartParam). 둘 다 본다.
       */
      function startParam() {
        const q = new URLSearchParams(location.search);
        return (
          tg?.initDataUnsafe?.start_param ||
          q.get('tgWebAppStartParam') ||
          q.get('startapp') ||
          ''
        );
      }

      /** 증권사 버튼으로 들어온 경우: 목록을 보여주지 않고 곧장 스토어로 보낸다. */
      function redirectMode(brokers, slug) {
        const entry = Object.entries(brokers).find(([, v]) => v.slug === slug);
        if (!entry) return false;

        const [name, links] = entry;
        const url = pickUrl(links);
        document.getElementById('meta').textContent = `${name} 앱으로 이동 중…`;
        document.getElementById('list').append(
          // 자동 이동이 막히는 경우를 대비한 수동 링크. 빈 화면으로 끝나면 안 된다.
          el('p', {}, el('a', { href: url, textContent: `${name} 열기` })),
        );
        openUrl(url);
        return true;
      }

      async function main() {
        const [snapshot, brokers] = await Promise.all([
          fetch('state/ipo.json').then((r) => r.json()),
          fetch('state/brokers.json').then((r) => r.json()),
        ]);

        const slug = startParam();
        if (slug && redirectMode(brokers, slug)) return;

        // 이미 끝난 공모는 앱을 열 이유가 없다. 진행 예정/중인 것만.
        const today = todayKst();
        const rows = Object.values(snapshot.items)
          .filter((r) => r.subEnd >= today)
          .sort((a, b) => a.subStart.localeCompare(b.subStart));

        document.getElementById('meta').textContent =
          `${today} 기준 · 진행 예정 ${rows.length}건` +
          (tg?.platform ? ` · ${tg.platform}` : '');

        const list = document.getElementById('list');
        if (rows.length === 0) {
          list.append(el('p', { textContent: '예정된 청약이 없습니다.' }));
          return;
        }
        for (const row of rows) list.append(renderRow(row, brokers));
      }

      main().catch((err) => {
        const p = document.getElementById('error');
        p.hidden = false;
        p.textContent = `불러오지 못했습니다: ${err.message}`;
        document.getElementById('meta').textContent = '';
      });
    </script>
  </body>
</html>
