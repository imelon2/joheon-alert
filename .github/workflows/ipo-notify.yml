name: ipo-notify

on:
  schedule:
    # cron은 UTC. GitHub 스케줄은 지연·스킵이 잦다(특히 신규 리포의 첫 실행과 정각
    # 부근 혼잡). 하루 실행을 통째로 놓치면 그날의 LISTING_DAY 등 날짜 기반 알림이
    # 영구 유실되므로, 시각을 벌려 두 번 친다 — 한 틱이 드롭돼도 다른 틱이 그날의
    # 크롤을 보장한다. 멱등성 키가 사건일 기준이라 둘 다 떠도 중복 발송은 없다
    # (두 번째는 대개 no-op).
    #
    # 두 틱 모두 KST 월~금 아침을 노린다. 단 09:00 KST를 넘기면 UTC가 당일로 넘어가
    # 요일 범위가 0-4 → 1-5로 바뀐다. 이 매핑을 건드리면 월요일이 빠지고 토요일에
    # 알림이 가므로 손대지 말 것.
    - cron: '30 23 * * 0-4' # 08:30 KST (UTC 전날 23:30, 일~목) — 주 틱, 장 시작 30분 전
    - cron: '30 0 * * 1-5'  # 09:30 KST (UTC 당일 00:30, 월~금) — 백업, 주 틱 드롭 대비
  workflow_dispatch: # 수동 실행. 그날 실행이 실패했을 때의 유일한 복구 경로다.

# 예약 실행과 수동 실행이 겹치면 state 커밋이 충돌한다. 진행 중인 것을 끝까지 두고
# 새 실행을 대기시킨다(cancel-in-progress: false) — 중간에 죽으면 발송은 됐는데
# state가 커밋되지 않아 다음 날 중복 발송이 난다.
concurrency:
  group: ipo-notify
  cancel-in-progress: false

permissions:
  contents: write # state/ 커밋용

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 공식 배포판은 full-ICU — euc-kr 디코딩에 필요
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 파서가 깨진 채로 알림이 나가는 것보다 여기서 멈추는 게 낫다.
      - name: 테스트
        run: pnpm test

      - name: 알림 실행
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm start

      # always()가 중요하다. 텔레그램 4xx(예: 잘못된 chat_id)일 때 파이프라인은
      # state를 전진시킨 뒤 실패로 종료하는데, 여기서 커밋을 건너뛰면 다음 날도
      # 같은 payload로 실패하는 무한 루프가 되어 이후 모든 알림이 죽는다.
      # 네트워크 실패 시에는 애초에 state를 쓰지 않으므로 이 단계가 no-op이 된다.
      - name: state 커밋
        if: always()
        run: |
          git config user.name  "ipo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/.gitkeep 덕분에 디렉터리는 항상 존재한다(없으면 pathspec 에러).
          git add state/
          # 두 파일을 한 커밋에 담는다. 커밋이 곧 영속화 경계라
          # 파일별로 나뉘어 절반만 남는 상황이 생기지 않는다.
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "state: $(date -u +%Y-%m-%d)"
            git push
          fi
