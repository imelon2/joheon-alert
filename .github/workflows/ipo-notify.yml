name: ipo-notify

on:
  schedule:
    # cron은 UTC. 22:30 UTC = 익일 07:30 KST. 월~금 청약일에 맞춰 일~목(UTC)에 실행.
    # 실행 시각은 수 분~수십 분 지연될 수 있다(GitHub Actions 특성). 일일 알림이라 무방하다.
    - cron: '30 22 * * 0-4'
  workflow_dispatch: # 수동 실행. 그날 실행이 실패했을 때의 유일한 복구 경로다.

# 예약 실행과 수동 실행이 겹치면 state 커밋이 충돌한다. 진행 중인 것을 끝까지 두고
# 새 실행을 대기시킨다(cancel-in-progress: false) — 중간에 죽으면 발송은 됐는데
# state가 커밋되지 않아 다음 날 중복 발송이 난다.
concurrency:
  group: ipo-notify
  cancel-in-progress: false

permissions:
  contents: write # state/ 커밋용

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 공식 배포판은 full-ICU — euc-kr 디코딩에 필요
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 파서가 깨진 채로 알림이 나가는 것보다 여기서 멈추는 게 낫다.
      - name: 테스트
        run: pnpm test

      - name: 알림 실행
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm start

      # always()가 중요하다. 텔레그램 4xx(예: 잘못된 chat_id)일 때 파이프라인은
      # state를 전진시킨 뒤 실패로 종료하는데, 여기서 커밋을 건너뛰면 다음 날도
      # 같은 payload로 실패하는 무한 루프가 되어 이후 모든 알림이 죽는다.
      # 네트워크 실패 시에는 애초에 state를 쓰지 않으므로 이 단계가 no-op이 된다.
      - name: state 커밋
        if: always()
        run: |
          git config user.name  "ipo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/.gitkeep 덕분에 디렉터리는 항상 존재한다(없으면 pathspec 에러).
          git add state/
          # 두 파일을 한 커밋에 담는다. 커밋이 곧 영속화 경계라
          # 파일별로 나뉘어 절반만 남는 상황이 생기지 않는다.
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "state: $(date -u +%Y-%m-%d)"
            git push
          fi
