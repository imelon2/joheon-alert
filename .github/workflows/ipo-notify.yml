name: ipo-notify

on:
  schedule:
    # cron은 UTC. GitHub 스케줄 실행은 크게 지연된다 — 이 리포 관측(2026-07-22~24):
    # 주 틱(23:30 UTC 예정)이 매일 +1h23~27m 밀려 ~09:55 KST 도착(장 시작 09:00 이후).
    # 지연 폭이 날마다 4분 이내로 일정한 게 특징. 멱등성 키가 사건일 기준이라 두 틱이
    # 둘 다 떠도 중복 발송은 없다(늦게 뜬 쪽은 대개 no-op).
    #
    # [주 틱] 08:30 KST 목표. 요일이 하루 당겨진 것은 의도된 것 — 23:30 UTC(전날)라
    # UTC 일~목 = KST 월~금. 09:00 KST를 넘기면 UTC가 당일로 넘어가 요일도 1-5로
    # 바뀌어야 하니 시각을 옮길 땐 재계산할 것.
    - cron: '30 23 * * 0-4' # 08:30 KST (UTC 전날 23:30, 일~목) — 주 틱
    #
    # [실험 틱] 지연이 일정하다면 예정을 앞당겨 실제 도착을 08:30 근처로 당길 수
    # 있는지 관측 중. 07:30 KST(22:30 UTC)로 당기고, 데이터를 빨리 모으려 매일 돌린다
    # (요일 * — 주말 포함 KST 전 요일. UTC 자정 이전이라 UTC/KST 요일이 같다).
    - cron: '30 22 * * *'   # 07:30 KST (22:30 UTC, 매일) — 앞당김 지연보정 실험
  workflow_dispatch: # 수동 실행. 그날 실행이 실패했을 때의 유일한 복구 경로다.

# 예약 실행과 수동 실행이 겹치면 state 커밋이 충돌한다. 진행 중인 것을 끝까지 두고
# 새 실행을 대기시킨다(cancel-in-progress: false) — 중간에 죽으면 발송은 됐는데
# state가 커밋되지 않아 다음 날 중복 발송이 난다.
concurrency:
  group: ipo-notify
  cancel-in-progress: false

permissions:
  contents: write # state/ 커밋용

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 공식 배포판은 full-ICU — euc-kr 디코딩에 필요
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 파서가 깨진 채로 알림이 나가는 것보다 여기서 멈추는 게 낫다.
      - name: 테스트
        run: pnpm test

      - name: 알림 실행
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm start

      # always()가 중요하다. 텔레그램 4xx(예: 잘못된 chat_id)일 때 파이프라인은
      # state를 전진시킨 뒤 실패로 종료하는데, 여기서 커밋을 건너뛰면 다음 날도
      # 같은 payload로 실패하는 무한 루프가 되어 이후 모든 알림이 죽는다.
      # 네트워크 실패 시에는 애초에 state를 쓰지 않으므로 이 단계가 no-op이 된다.
      - name: state 커밋
        if: always()
        run: |
          git config user.name  "ipo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/.gitkeep 덕분에 디렉터리는 항상 존재한다(없으면 pathspec 에러).
          git add state/
          # 두 파일을 한 커밋에 담는다. 커밋이 곧 영속화 경계라
          # 파일별로 나뉘어 절반만 남는 상황이 생기지 않는다.
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "state: $(date -u +%Y-%m-%d)"
            git push
          fi
